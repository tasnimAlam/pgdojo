services:
  pg:
    image: docker.io/library/postgres:17
    environment:
      POSTGRES_USER: pgex
      POSTGRES_PASSWORD: pgex
      POSTGRES_DB: exercises
    ports: ["5433:5432"]
    volumes:
      - ./clubdata.sql:/docker-entrypoint-initdb.d/01-clubdata.sql:ro
      - ./roles.sql:/docker-entrypoint-initdb.d/02-roles.sql:ro
