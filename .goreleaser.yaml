# Build release archives: goreleaser release --clean (needs a v* git tag).
version: 2
project_name: pgdojo

before:
  hooks:
    - go test -short ./...

builds:
  - main: ./cmd/pgdojo
    binary: pgdojo
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - src: internal/exercise/data/LICENSE-exercises
        dst: LICENSE-exercises
      - db/compose.yaml
      - db/roles.sql

checksum:
  name_template: checksums.txt

changelog:
  use: git
  filters:
    exclude:
      - "^docs"
      - "^test"

release:
  github:
    owner: tasnimAlam
    name: pgdojo
